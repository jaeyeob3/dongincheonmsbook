<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>동인천중 추천도서 - 교과연계 50선</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(135deg, #1e5a96 0%, #2a7fb0 50%, #4a9fd8 100%);
            min-height: 100vh;
            padding: 20px;
            color: #2c2c2c;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header { 
            text-align: center; 
            color: #f8f9fa; 
            margin-bottom: 50px; 
            padding: 50px 20px; 
            position: relative;
        }
        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 150px;
            height: 4px;
            background: linear-gradient(90deg, #ffd700, #ffed4a);
            border-radius: 2px;
        }
        .header h1 { 
            font-size: 2.8em; 
            margin-bottom: 15px; 
            font-weight: 400;
            letter-spacing: 2px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .book-count { 
            font-size: 1.3em; 
            color: rgba(255,255,255,0.9); 
            margin-top: 10px; 
            background: rgba(255,255,255,0.1); 
            padding: 12px 30px; 
            border-radius: 30px; 
            display: inline-block; 
            backdrop-filter: blur(10px); 
        }
        
        .filter-wrap { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            align-items: center; 
            margin-bottom: 35px; 
        }
        .search-box input { 
            width: 350px; 
            padding: 15px 20px; 
            border-radius: 30px; 
            border: 2px solid rgba(255,255,255,0.2); 
            font-size: 1em; 
            outline: none; 
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            color: white;
            font-family: inherit;
        }
        .search-box input::placeholder { color: rgba(255,255,255,0.7); }
        .category-container { 
            display: flex; 
            gap: 8px; 
            flex-wrap: wrap; 
            justify-content: center; 
        }
        .category-btn { 
            padding: 10px 20px; 
            border: 2px solid rgba(255,255,255,0.3); 
            background: rgba(255,255,255,0.1); 
            color: #fff; 
            border-radius: 25px; 
            cursor: pointer; 
            transition: all 0.3s; 
            font-family: inherit;
            font-weight: 500;
            font-size: 0.9em;
            backdrop-filter: blur(10px);
        }
        .category-btn.active, .category-btn:hover { 
            background: linear-gradient(135deg, #ffd700, #ffed4a); 
            color: #1a1a1a;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255,215,0,0.4);
        }

        .books-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 30px; 
            padding-bottom: 30px;
        }
        .book-card { 
            background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(225,245,255,0.95));
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 30px 50px rgba(0,0,0,0.25); 
            transition: all 0.4s ease;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid rgba(74,159,216,0.2);
        }
        .book-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #ffd700, #ffed4a, #ffd700);
            z-index: 2;
        }
        .book-card:hover { 
            transform: translateY(-10px) scale(1.04); 
            box-shadow: 0 40px 80px rgba(0,0,0,0.3);
        }
        
        .book-cover { 
            height: 380px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, #4a9fd8 0%, #2a7fb0 100%);
        }
        .book-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .book-card:hover .book-cover img {
            transform: scale(1.05);
        }
        .book-cover .category {
            position: absolute;
            top: 15px;
            right: 20px;
            background: linear-gradient(135deg, #ffd700, #ffed4a);
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 0.85em;
            font-weight: 700;
            color: #1a1a1a;
            box-shadow: 0 4px 12px rgba(255,215,0,0.6);
            z-index: 1;
            backdrop-filter: blur(10px);
        }
        .book-cover .fallback {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2a7fb0 0%, #1e5a96 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        .book-cover .fallback::before {
            content: '📖';
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.9;
        }
        
        .book-summary {
            padding: 25px 30px 20px;
            flex-grow: 1;
            font-size: 0.92em;
            line-height: 1.65;
            color: #333;
            font-family: 'Georgia', serif;
        }
        .book-info { 
            padding: 0 30px 25px;
        }
        .book-title { 
            font-size: 1.25em; 
            font-weight: 700; 
            margin-bottom: 6px; 
            color: #1a1a1a;
        }
        .book-author { 
            font-size: 1em; 
            margin-bottom: 20px; 
            color: #666; 
            font-style: italic;
        }
        .btn-wrap { display: flex; gap: 10px; }
        .btn { 
            flex: 1; 
            padding: 12px; 
            font-size: 0.95em; 
            border-radius: 10px; 
            border: none; 
            color: white; 
            cursor: pointer; 
            font-weight: 600; 
            text-decoration: none; 
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn-yes { background: linear-gradient(135deg, #c9184a, #a01538); }
        .btn-ali { background: linear-gradient(135deg, #0094c8, #007aa4); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
        
        .footer { 
            margin-top: 60px; 
            text-align: center; 
            font-size: 0.95em; 
            color: rgba(255,255,255,0.85); 
            padding: 30px;
            backdrop-filter: blur(10px);
        }
        
        @media (max-width: 768px) { 
            .header h1 { font-size: 2.2em; } 
            .books-grid { gap: 25px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); } 
            .book-cover { height: 320px; }
            .search-box input { width: 100%; max-width: 280px; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>📚 동인천중 교과연계 추천도서</h1>
        <div class="book-count">총 <span id="bookCount">50</span>권 (교과별 심화학습 필독서)</div>
    </div>
    
    <div class="filter-wrap">
        <div class="search-box">

        </div>
        <div class="category-container">
            <button class="category-btn active" onclick="filterCategory('all', this)">전체</button>
            <button class="category-btn" onclick="filterCategory('국어', this)">국어</button>
            <button class="category-btn" onclick="filterCategory('역사', this)">역사</button>

</div>

    { id:15, title:"먼 나라 이웃 나라", author:"이원복", category:"사회", img:"https://image.aladin.co.kr/product/7/8/9788963193402_1.jpg", summary:"세계 각국 문화와 생활양식 소개. 지리/사회 교과 연계. 다양한 문화 이해와 글로벌 시민의식 함양." },

];

document.getElementById('bookCount').textContent = books.length;

let currentCategory = 'all';

function filterCategory(category, btn) {
    currentCategory = category;
    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderBooks();
}

function renderBooks() {
    const grid = document.getElementById("booksGrid");
    grid.innerHTML = "";
    const keyword = document.getElementById("searchInput").value.trim();

    const filteredBooks = books.filter(book => {
        const matchCategory = (currentCategory === 'all' || book.category === currentCategory);
        const matchSearch = book.title.includes(keyword) || book.author.includes(keyword);
        return matchCategory && matchSearch;
    });

    filteredBooks.forEach(book => {
        const infoUrl = `https://www.aladin.co.kr/search/wsearchresult.aspx?SearchTarget=Book&SearchWord=${encodeURIComponent(book.title)}`;
        const reviewUrl = "https://read365.edunet.net/PureScreen/SchoolSearch?schoolName=%EB%8F%99%EC%9D%B8%EC%B2%9C%EC%A4%91%ED%95%99%EA%B5%90%EB%8F%84%EC%84%9C%EA%B4%80&provCode=E10&neisCode=E100000620";

        const card = document.createElement("div");
        card.className = "book-card";

        card.innerHTML = `
            <div class="book-cover">
                <div class="category">${book.category}</div>
                <img src="${book.img}" alt="${book.title}" 
                     onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"/>
                <div class="fallback" style="display:none;">
                    <div class="title">${book.title}</div>
                </div>
            </div>
            <div class="book-summary">
                <p>${book.summary}</p>
            </div>
            <div class="book-info">
                <div class="book-title">${book.title}</div>
                <div class="book-author">저자: ${book.author}</div>
                <div class="btn-wrap">
                    <a class="btn btn-yes" href="${infoUrl}" target="_blank">책정보</a>
                    <a class="btn btn-ali" href="${reviewUrl}" target="_blank">독후감</a>
                </div>
            </div>
        `;
        grid.appendChild(card);
    });
}

window.onload = () => renderBooks();
</script>
</body>
</html>
