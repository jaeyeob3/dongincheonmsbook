<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>중학생 추천도서 목록</title>
  <style>
    body { font-family: sans-serif; background: #f9f9f9; padding: 20px; }
    h1 { text-align: center; }
    .menu { text-align: center; margin-bottom: 20px; }
    .menu button { margin: 5px; padding: 10px 20px; }
    .book-list { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
    .book-card { background: white; padding: 10px; border-radius: 8px; width: 150px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); cursor: pointer; }
    .book-card img { width: 100%; border-radius: 4px; }
    .detail { display: none; margin-top: 30px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .detail img { float: left; margin-right: 20px; width: 150px; }
    .detail button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>

<h1>중학생 추천도서 목록</h1>

<div class="menu">
  <button onclick="filterCategory('국어')">국어</button>
  <button onclick="filterCategory('사회')">사회</button>
  <button onclick="filterCategory('과학')">과학</button>
  <button onclick="filterCategory('영어')">영어</button>
  <button onclick="filterCategory('예술')">예술</button>
</div>

<div class="book-list" id="bookList">
  <div class="book-card" onclick="showDetail('소나기')">
    <img src="https://upload.wikimedia.org/wikipedia/ko/thumb/3/3b/Sonagi_cover.jpg/220px-Sonagi_cover.jpg" alt="소나기">
    <p>소나기</p>
  </div>
  <div class="book-card" onclick="showDetail('춘향전')">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Chunhyangjeon.jpg/220px-Chunhyangjeon.jpg" alt="춘향전">
    <p>춘향전</p>
  </div>
  <div class="book-card" onclick="showDetail('파브르 곤충기')">
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/6f/Fabres_insects.jpg/220px-Fabres_insects.jpg" alt="파브르 곤충기">
    <p>파브르 곤충기</p>
  </div>
</div>

<div class="detail" id="detailBox">
  <img id="detailImg" src="" alt="책표지">
  <div>
    <h2 id="detailTitle">제목</h2>
    <p id="detailAuthor">저자: </p>
    <p id="detailPublisher">출판사: </p>
    <p id="detailGrade">학년: </p>
    <p id="detailSummary">줄거리: </p>
    <a href="https://reading.dongincheon.ms.kr" target="_blank">
      <button>독후감 쓰기</button>
    </a>
  </div>
</div>

<script>
  const books = {
    '소나기': {
      img: 'https://upload.wikimedia.org/wikipedia/ko/thumb/3/3b/Sonagi_cover.jpg/220px-Sonagi_cover.jpg',
      author: '황순원',
      publisher: 'DB',
      grade: '1학년',
      summary: '소년과 소녀 간의 첫사랑을 그린 작품으로, 소녀가 갑작스럽게 목숨을 잃게 되는 이야기.'
    },
    '춘향전': {
      img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Chunhyangjeon.jpg/220px-Chunhyangjeon.jpg',
      author: '작자 미상',
      publisher: '고전문학',
      grade: '2학년',
      summary: '춘향과 이몽룡의 사랑 이야기로, 신분을 초월한 사랑과 정의를 다룸.'
    },
    '파브르 곤충기': {
      img: 'https://upload.wikimedia.org/wikipedia/commons/thumb/6/6f/Fabres_insects.jpg/220px-Fabres_insects.jpg',
      author: '장 앙리 파브르',
      publisher: '과학출판사',
      grade: '3학년',
      summary: '곤충의 생태를 관찰하고 기록한 과학 도서로, 자연에 대한 흥미를 높여줌.'
    }
  };

  function showDetail(title) {
    const book = books[title];
    document.getElementById('detailImg').src = book.img;
    document.getElementById('detailTitle').innerText = title;
    document.getElementById('detailAuthor').innerText = '저자: ' + book.author;
    document.getElementById('detailPublisher').innerText = '출판사: ' + book.publisher;
    document.getElementById('detailGrade').innerText = '학년: ' + book.grade;
    document.getElementById('detailSummary').innerText = '줄거리: ' + book.summary;
    document.getElementById('detailBox').style.display = 'block';
  }

  function filterCategory(category) {
    alert(category + ' 분야의 도서를 보여줍니다 (기능 확장 예정)');
  }
</script>

</body>
</html>
